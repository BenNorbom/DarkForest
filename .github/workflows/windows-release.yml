name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test the simulation
        run: npm test

      - name: Build the installer
        id: build
        run: |
          $base = node -p 'require("./package.json").version.split(".").slice(0,2).join(".")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          npm version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -ne $env:GITHUB_SHA) {
            Write-Host 'A newer push to main will publish its own release.'
            exit 0
          }

          $tag = $env:RELEASE_TAG
          $assets = @('dist/Dark-Forest-Setup.exe', 'dist/Dark-Forest-Setup.exe.blockmap', 'dist/latest.yml')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset $asset" }
          }
          $release = gh release view $tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "Dark Forest $tag" `
              --notes 'Download **Dark-Forest-Setup.exe** from Assets to install on Windows x64.' --generate-notes --latest
            exit $LASTEXITCODE
          }

          $release = $release | ConvertFrom-Json
          if (-not $release.isDraft) {
            Write-Host "Release $tag is already published."
            exit 0
          }
          if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw "Release draft $tag targets a different commit" }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          exit $LASTEXITCODE
